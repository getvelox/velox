key: openai_style
version: 4.0.0
name: OpenAI (GPT) token pricing
summary: |
  Ready-made pricing for reselling OpenAI (GPT) API access. Bills each
  customer per token — with separate rates for every GPT and embedding
  model and for input, output, and cached tokens — on a monthly plan.
description: |
  Sets up everything you need to bill customers for OpenAI usage:

    • A usage meter that counts tokens
    • Per-token prices for the current GPT-5.x models, the o-series
      reasoning models, the older GPT-4 / 3.5 models, and OpenAI's
      embedding models
    • Separate rates for input, output, and cached input — cached input is
      discounted, matching OpenAI's pricing (OpenAI has no separate
      cache-write fee)
    • A monthly plan your customers subscribe to
    • Automatic payment retries and a notifications endpoint you can point
      at your own systems

  Prices start at OpenAI's public list rates — a starting point you'll edit
  to your own margins after setup. Before installing, you can set the
  currency and the plan's name.

overridable:
  - key: currency
    type: string
    default: USD
    enum: [USD, EUR, GBP]
  - key: plan_name
    type: string
    default: OpenAI-style API
    max_length: 80
  - key: plan_code
    type: string
    default: openai_api_pro
    pattern: '^[a-z][a-z0-9_]*$'

meters:
  - key: tokens
    name: Tokens
    unit: tokens
    aggregation: sum

rating_rules:
  # gpt-5.1 — input $1.25 / output $10 per million; cache read $0.125 (per-token)
  - key: gpt51_input
    name: GPT-5.1 input
    mode: flat
    currency: '{{ .currency }}'
    flat_amount_cents: '0.000125'
  - key: gpt51_cache_read
    name: GPT-5.1 cache read
