key: anthropic_style
version: 5.0.0
name: Anthropic (Claude) token pricing
summary: |
  Ready-made pricing for reselling Claude (Anthropic) API access. Bills each
  customer per token — with separate rates for every model and for input,
  output, and cached tokens — on a monthly plan.
description: |
  Sets up everything you need to bill customers for Claude (Anthropic) usage:

    • A usage meter that counts tokens
    • Per-token prices for every Claude model with a published price —
      the current 5-generation lineup (Fable, Mythos, Opus, Sonnet 5),
      the Opus/Sonnet 4.x line, Haiku 4.5, and older 3.x models —
      matching Anthropic's public pricing page
    • Separate rates for input, output, and cached tokens — cache reads are
      steeply discounted (0.1x input) while cache writes carry a premium
      (1.25x for 5-minute, 2x for 1-hour caching), exactly as Anthropic
      prices them
    • A monthly plan your customers subscribe to
    • Automatic payment retries and a notifications endpoint you can point
      at your own systems

  Prices start at Anthropic's public list rates — a starting point you'll
  edit to your own margins after setup. Before installing, you can set the
  currency and the plan's name.

overridable:
  - key: currency
    type: string
    default: USD
    enum: [USD, EUR, GBP]
  - key: plan_name
    type: string
    default: AI API
    max_length: 80
  - key: plan_code
    type: string
    default: ai_api_pro
    pattern: '^[a-z][a-z0-9_]*$'

meters:
  - key: tokens
    name: Tokens
    unit: tokens
    aggregation: sum

rating_rules:
  # Claude Opus 4.5 — input $5.00 / output $25.00 per million (per-token).
  # Cache multiples as everywhere: read 0.1×, 5m write 1.25×, 1h write 2×.
  - key: opus45_input
    name: Claude Opus 4.5 input
    mode: flat
    currency: '{{ .currency }}'
    flat_amount_cents: '0.0005'
  - key: opus45_output
    name: Claude Opus 4.5 output
    mode: flat
    currency: '{{ .currency }}'
    flat_amount_cents: '0.0025'
  - key: opus45_cache_read
    name: Claude Opus 4.5 cache read
    mode: flat
    currency: '{{ .currency }}'
    flat_amount_cents: '0.00005'
  - key: opus45_cache_write_5m
    name: Claude Opus 4.5 cache write (5m)
    mode: flat
    currency: '{{ .currency }}'
    flat_amount_cents: '0.000625'
  - key: opus45_cache_write_1h
    name: Claude Opus 4.5 cache write (1h)
    mode: flat
    currency: '{{ .currency }}'
    flat_amount_cents: '0.001'

  # Claude Sonnet 4.5 — input $3.00 / output $15.00 per million (per-token).
