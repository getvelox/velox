name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  # Manual/API escape hatch (2026-07-27): during the GitHub Actions
  # event-delivery degradation, pull_request events were silently
  # dropped for hours and no run was ever created — leaving green,
  # protection-blocked PRs with "no checks" and nothing to retry.
  # workflow_dispatch lets `gh workflow run ci.yml --ref <branch>`
  # mint the run directly through the API (no webhook pipeline);
  # its check runs attach to the head SHA, satisfying the same
  # required checks.
  workflow_dispatch:

# One live run per ref: repeated pushes to a PR cancel the obsolete
# run instead of queueing behind it — less event pressure, faster
# feedback, no duplicate spend. Main pushes never cancel (history
# builds stay complete).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Least-privilege GITHUB_TOKEN (docs: "set the default permission for the
# GITHUB_TOKEN to read access only"). Specifying any scope zeroes the
# rest; the docker job re-widens its own (packages/id-token) per-job.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # 35, not 20: measured 2026-08-31 across 12 runs, this job takes 7-10
    # minutes normally — but a slow runner stretches everything uniformly
    # (~3.35x observed across unrelated packages, 323s -> 1060s of package
    # time for identical code), which pushes 9 minutes past a 20-minute cap.
    # Both jobs were cancelled that way on the same day, each costing a
    # diagnosis and a re-run of green code. The cap is here to bound a HANG —
    # which would sit forever regardless — not to police runner variance, so
    # it buys headroom above the observed variance instead of tracking the
    # median. If a job ever legitimately approaches 35 minutes, split the
    # suite rather than raising this again.
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: velox
          POSTGRES_USER: velox
          POSTGRES_PASSWORD: velox
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.7'

      - name: Build
        run: go build ./...

      - name: Verify modules
        run: go mod verify

      - name: Unit Tests (with race detector)
        run: go test ./... -race -short -count=1 -coverprofile=coverage.out

      - name: Vet
        run: go vet ./...

      - name: Vulnerability check
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.1.4 && govulncheck ./...

      - name: Create test database and app user
        run: |
          # velox_app is referenced by migration GRANT statements (source of
          # truth is docker/init.sql for local dev). It must exist cluster-wide
          # before migrations run or they fail with "role does not exist".
          #
          # Separate -c invocations: CREATE DATABASE cannot run inside a
          # transaction block, and psql wraps multi-statement -c in a txn.
          PGPASSWORD=velox psql -h localhost -U velox -d velox \
            -c "CREATE ROLE velox_app WITH LOGIN PASSWORD 'velox_app';" \
            -c "CREATE DATABASE velox_test OWNER velox;"
          PGPASSWORD=velox psql -h localhost -U velox -d velox_test -c "
            CREATE EXTENSION IF NOT EXISTS pgcrypto;
            CREATE ROLE velox_test_app WITH LOGIN PASSWORD 'velox_test_app';
            GRANT ALL PRIVILEGES ON DATABASE velox_test TO velox_test_app;
            GRANT ALL ON SCHEMA public TO velox_test_app;
            ALTER DEFAULT PRIVILEGES FOR ROLE velox IN SCHEMA public GRANT ALL ON TABLES TO velox_test_app;
            ALTER DEFAULT PRIVILEGES FOR ROLE velox IN SCHEMA public GRANT ALL ON SEQUENCES TO velox_test_app;
          "

      - name: Integration Tests
        run: go test -p 1 ./... -count=1 -short=false
        env:
          TEST_ADMIN_DATABASE_URL: postgres://velox:velox@localhost:5432/velox_test?sslmode=disable
          TEST_DATABASE_URL: postgres://velox_test_app:velox_test_app@localhost:5432/velox_test?sslmode=disable

      # Money-invariant sweep over whatever the integration suite left behind
      # (docs/dev/product-stability-plan.md B1). The doctor's own test already
      # proves the catalog runs and catches seeded violations on a fresh DB;
      # THIS step asks a different question — did any test's real writer
      # sequence leave data no legal writer should produce? Owner DSN on
      # purpose: an RLS-scoped role would make the sweep silently blind.
      # The harness truncates at SETUP only (internal/testutil/db.go), so the
      # rows this sweep sees are whatever the alphabetically-last DB package's
      # last test left behind — today that residue is doctor-clean; a package
      # sorting after internal/webhook, or a test seeding a doctor-visible
      # inconsistency, changes what is examined here.
      - name: Money-invariant sweep (velox-doctor)
        run: go run ./cmd/velox-doctor
        env:
          DATABASE_URL: postgres://velox:velox@localhost:5432/velox_test?sslmode=disable

      - name: Upload Coverage
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v6
        with:
          file: coverage.out
        continue-on-error: true

  # The same integration suite with the APP pool behind PgBouncer in
  # TRANSACTION mode (ADR-114 PR-E). Since the leader-lease cutover every
  # statement Velox issues is meant to be self-contained; this job is what
  # makes that a checked property instead of a claim. Anything that assumes
  # a session — SET without LOCAL, a session advisory lock, a prepared
  # statement reused across transactions — passes on the direct-connection
  # job above and fails here. Admin/migration traffic stays direct, as
  # production migrations do (docs/ops/postgres-requirements.md).
  test-pgbouncer:
    runs-on: ubuntu-latest
    # 35, not 20: measured 2026-08-31 across 12 runs, this job takes 7-10
    # minutes normally — but a slow runner stretches everything uniformly
    # (~3.35x observed across unrelated packages, 323s -> 1060s of package
    # time for identical code), which pushes 9 minutes past a 20-minute cap.
    # Both jobs were cancelled that way on the same day, each costing a
    # diagnosis and a re-run of green code. The cap is here to bound a HANG —
    # which would sit forever regardless — not to police runner variance, so
    # it buys headroom above the observed variance instead of tracking the
    # median. If a job ever legitimately approaches 35 minutes, split the
    # suite rather than raising this again.
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: velox
          POSTGRES_USER: velox
          POSTGRES_PASSWORD: velox
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.7'

      - name: Create test database and app user
        run: |
          PGPASSWORD=velox psql -h localhost -U velox -d velox \
            -c "CREATE ROLE velox_app WITH LOGIN PASSWORD 'velox_app';" \
            -c "CREATE DATABASE velox_test OWNER velox;"
          PGPASSWORD=velox psql -h localhost -U velox -d velox_test -c "
            CREATE EXTENSION IF NOT EXISTS pgcrypto;
            CREATE ROLE velox_test_app WITH LOGIN PASSWORD 'velox_test_app';
            GRANT ALL PRIVILEGES ON DATABASE velox_test TO velox_test_app;
            GRANT ALL ON SCHEMA public TO velox_test_app;
            ALTER DEFAULT PRIVILEGES FOR ROLE velox IN SCHEMA public GRANT ALL ON TABLES TO velox_test_app;
            ALTER DEFAULT PRIVILEGES FOR ROLE velox IN SCHEMA public GRANT ALL ON SEQUENCES TO velox_test_app;
          "

      - name: Integration Tests through PgBouncer (transaction mode)
        run: PGB_MODE=ci scripts/pgbouncer-test.sh

  # Golden path: the README quickstart + scripts/demo.sh, executed for real.
  # This is the whole wedge chain in one run — recipe → test-clock customer →
  # LiteLLM-shaped token ingest → provider cost rates → simulated month →
  # finalized invoice with per-(model, token_type) lines + PDF → margin
  # report. demo.sh fails loudly at the first API mismatch, so this job is
  # what keeps the front door structurally unable to lie again (it rotted
  # silently for months once — front-door audit 2026-07-05, PR #374).
  golden-path:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: velox
          POSTGRES_USER: velox
          POSTGRES_PASSWORD: velox
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://velox:velox@localhost:5432/velox?sslmode=disable
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.7'

      - name: Create app role (mirrors deploy/compose/postgres-init.sh)
        run: |
          # Same grants production init gives the runtime role — without the
          # DEFAULT PRIVILEGES line, tables created by migrations are
          # invisible to velox_app and the API 500s (caught by this job's
          # first run: permission denied for provider_cost_rates).
          PGPASSWORD=velox psql -v ON_ERROR_STOP=1 -h localhost -U velox -d velox <<'EOSQL'
          CREATE ROLE velox_app WITH LOGIN PASSWORD 'velox_app';
          GRANT ALL PRIVILEGES ON DATABASE velox TO velox_app;
          GRANT ALL ON SCHEMA public TO velox_app;
          ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON TABLES TO velox_app;
          ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON SEQUENCES TO velox_app;
          CREATE EXTENSION IF NOT EXISTS pgcrypto;
          EOSQL

      - name: Bootstrap (migrations + demo tenant + keys)
        run: |
          go run ./cmd/velox-bootstrap | tee bootstrap.out
          grep -oE 'vlx_secret_test_[a-f0-9]+' bootstrap.out | head -1 > secret.key
          test -s secret.key

      - name: Start API
        run: |
          nohup go run ./cmd/velox > server.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:8080/health >/dev/null 2>&1 && exit 0
            sleep 1
          done
          echo "server never became healthy"; tail -50 server.log; exit 1

      - name: Run the golden path (scripts/demo.sh)
        run: ./scripts/demo.sh "$(cat secret.key)"

      - name: Server log on failure
        if: failure()
        run: tail -100 server.log || true

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.7'

      - uses: golangci/golangci-lint-action@9fae48acfc02a90574d7c304a1758ef9895495fa # v7
        with:
          # Pinned: the action installs the LATEST golangci-lint when unpinned,
          # so a linter release changes CI results with no change in this repo —
          # v2.13.0 (2026-08-19) turned three pre-existing stripe-go SA1019
          # deprecation warnings into errors and broke every open PR while main
          # stayed green (#834 tracks fixing the deprecations properly).
          # Bump this deliberately, with the fix for whatever the new version flags.
          version: v2.12.2

      # The Dockerfile's builder image must be at least go.mod's `go` directive.
      # It runs GOTOOLCHAIN=local, so an older builder does not quietly fetch a
      # newer toolchain — `go mod download` just fails.
      #
      # This is checked HERE, in a job that runs on pull requests, because the
      # docker job only runs on main. Bumping go.mod's directive in a PR left
      # every subsequent main build broken with nothing failing on the PR itself;
      # main sat red for days behind a job nobody was watching.
      - name: Go version consistency (go.mod vs Dockerfile builder)
        run: |
          set -euo pipefail
          MOD=$(awk '/^go [0-9]/ {print $2; exit}' go.mod)
          IMG=$(sed -n 's/^FROM golang:\([0-9.]*\)-alpine AS builder$/\1/p' Dockerfile)
          if [ -z "$MOD" ] || [ -z "$IMG" ]; then
            echo "could not parse versions (go.mod='$MOD' Dockerfile='$IMG')" >&2
            exit 1
          fi
          echo "go.mod requires go $MOD; Dockerfile builds on golang:$IMG-alpine"
          # Lowest of the two must be the go.mod one, i.e. IMG >= MOD.
          if [ "$(printf '%s\n%s\n' "$MOD" "$IMG" | sort -V | head -1)" != "$MOD" ]; then
            echo "::error::Dockerfile builder golang:$IMG is OLDER than go.mod's 'go $MOD'. The image build runs GOTOOLCHAIN=local and will fail with 'go.mod requires go >= $MOD'. Bump the FROM line in Dockerfile." >&2
            exit 1
          fi

      # ADR-030 guard: bare `time.Now()` in service / store / engine
      # code on clock-pinned-entity domains leaks wall-clock into
      # rows that catchup queries read against frozen_time. Run as
      # part of the lint job (no extra runner cost) — the script
      # exits non-zero with a helpful message on any violation.
      - name: lint-clock (ADR-030)
        run: make lint-clock

      # Funding-set invariant: a period can be funded by >1 invoice, so
      # period-wide credit/clawback/void must reconcile against
      # FindFundingInvoicesForPeriod, not a single-row lookup. Flags new
      # unjustified single-invoice lookups (the class that caused the 2026-06-15
      # multi-invoice proration bugs). Bypass a legitimate use with a same/
      # preceding-line `// single-invoice-ok: <reason>`.
      - name: lint-funding-set (ADR-048 amendment)
        run: make lint-funding-set

      # Anti-rot guard: fail if MANUAL_TEST.md names a metric / column / table /
      # meter-key the code no longer has. CI catches generated-artifact drift but
      # not prose; this is the cheap prose guard ("a flow that lies is worse than
      # no flow"). Bypass a legitimate mention with a `currency-ok:` HTML comment.
      - name: lint-manual-test (doc currency)
        run: make lint-manual-test

      # Timezone-display invariant (ADR-076): a civil-day .Format() must render
      # in an explicit .In(loc) zone, never the process/host zone or a stray
      # .UTC() on a customer date; and the ADR-075 process-UTC pin must be
      # present. A green run is a machine-checked proof the invariant holds — it
      # turns the reactive ADR-074/075 audits (~8 fixed render-site bugs) into a
      # permanent gate. Bypass a genuine UTC/filename case with a same-line //tz:ok.
      - name: lint-tz (ADR-076)
        run: make lint-tz

  # codegen-drift fails the build when api/openapi.yaml has been edited
  # without regenerating the Go and TS artifacts that derive from it
  # (or vice versa — when a generated file was hand-edited). The check
  # is `make gen && git diff --exit-code`: regenerate everything from
  # the canonical spec, then assert nothing in the working tree
  # changed. Same pattern Stripe uses internally to keep its SDK
  # repos in sync with the openapi repo.
  # Internal Markdown links only — a moved or renamed doc breaks a link
  # silently, and this repo's docs cross-reference heavily (ADRs, benchmark
  # docs, the failure-mode catalog). External URLs are deliberately NOT
  # checked here: a third-party site being down or rate-limiting would fail
  # unrelated PRs. Run `lychee --offline '**/*.md'` locally for the same check.
  doc-links:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Check internal Markdown links
        uses: lycheeverse/lychee-action@82202e5e9c2f4ef1a55a3d02563e1cb6041e5332 # v2.4.1
        with:
          # --offline: resolve local file paths and anchors, skip the network.
          args: --offline --no-progress --include-fragments '**/*.md'
          fail: true

  codegen-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.7'

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web-v2/package-lock.json

      - name: Install web-v2 deps
        run: cd web-v2 && npm ci --legacy-peer-deps

      - name: Regenerate from api/openapi.yaml
        run: make gen

      - name: Fail on uncommitted regenerated files
        run: |
          if ! git diff --exit-code; then
            echo "::error::api/openapi.yaml drift: regenerated files differ from committed copies. Run 'make gen' locally and commit the result."
            exit 1
          fi

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web-v2/package-lock.json

      - name: Install and build frontend
        # `npm run build` = `tsc -b && vite build` — the strict project-
        # references build (tsconfig.app.json: noUnusedLocals etc.). The old
        # `npx tsc --noEmit` used the looser root config and `vite build`
        # strips types without checking, so production type errors (incl.
        # genuine bugs) accumulated invisibly. The production build is the gate.
        run: cd web-v2 && npm ci --legacy-peer-deps && npm run build

      # The web-v2 unit suite (effectiveNow drift-guard, csv, vocabulary) ran
      # NOWHERE in CI until 2026-07-19 — a green pipeline said nothing about
      # it.
      - name: Frontend unit tests
        run: cd web-v2 && npm test

      # Lint gates the ERROR-level rules: the ADR-086 relative-time ban
      # (raw Date.now()) and the react-hooks error rules (refs,
      # set-state-in-effect, static-components). Warn-level rules —
      # exhaustive-deps among them — do NOT fail the run (plain eslint,
      # no --max-warnings): they surface in the log only. First wired
      # 2026-07-19 after the 10 react-hooks errors blocking a green run
      # were fixed — before that, eslint.config.js claimed to be a CI
      # gate while lint ran nowhere.
      - name: Frontend lint
        run: cd web-v2 && npm run lint

  docker:
    timeout-minutes: 30
    needs: [test, frontend, lint]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      # contents: write — anchore/sbom-action attaches the SBOM to the
      # GitHub release on tag runs (REST call; read-only token fails with
      # "Resource not accessible by integration", which skipped Grype+Cosign
      # on v0.3.0/v0.3.1 — those two image sets shipped unsigned).
      contents: write
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tag pushes (vX.Y.Z) publish a pinnable versioned image + stamp the
      # binary (velox version / Velox-Version header). Main pushes keep the
      # :sha and :latest moving tags with a dev-<sha> stamp — operators are
      # told to pin version tags (deploy/compose/README.md).
      - name: Compute image tags + version stamp
        id: meta
        run: |
          REPO="ghcr.io/${{ github.repository }}"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
            REF_TAG="${VERSION}"
          else
            VERSION="dev-${GITHUB_SHA::7}"
            REF_TAG="${GITHUB_SHA}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "ref_tag=${REF_TAG}" >> "$GITHUB_OUTPUT"
          {
            echo "tags<<TAGS"
            echo "${REPO}:${REF_TAG}"
            echo "${REPO}:latest"
            echo "TAGS"
            echo "dashtags<<DTAGS"
            echo "${REPO}-dashboard:${REF_TAG}"
            echo "${REPO}-dashboard:latest"
            echo "DTAGS"
          } >> "$GITHUB_OUTPUT"


      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          push: true
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The operator dashboard image (compose's velox-dashboard service) —
      # published alongside the API so a VPC install never builds from
      # source unless it wants to.
      - name: Build and push dashboard image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: deploy/compose/Dockerfile.dashboard
          push: true
          tags: ${{ steps.meta.outputs.dashtags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image for vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          # The tag THIS run pushed (version tag on releases, sha on main).
          # github.sha here scanned a tag release runs never push — the
          # published versioned image sailed through unscanned/unsigned.
          image-ref: ghcr.io/${{ github.repository }}:${{ steps.meta.outputs.ref_tag }}
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Generate SBOM (Syft)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ghcr.io/${{ github.repository }}:${{ steps.meta.outputs.ref_tag }}
          artifact-name: velox-sbom.spdx.json
          format: spdx-json
          output-file: velox-sbom.spdx.json

      - name: Scan SBOM (Grype)
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7
        with:
          sbom: velox-sbom.spdx.json
          fail-build: true
          severity-cutoff: critical

      - name: Sign image (Cosign)
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
      - run: cosign sign --yes ghcr.io/${{ github.repository }}:${{ steps.meta.outputs.ref_tag }}
        env:
          COSIGN_EXPERIMENTAL: "1"
